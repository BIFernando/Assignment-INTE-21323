name: TMS AWS Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./Backend
        run: npm install

      - name: Verify Backend
        working-directory: ./Backend
        run: node -e "console.log('Backend syntax OK')"

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t tms-backend ./Backend

      - name: Build Frontend Docker Image
        run: docker build -t tms-frontend ./Frontend

      - name: Success
        run: echo "Docker images built successfully"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-docker

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Assignment-INTE-21323

            git fetch origin
            git reset --hard origin/main

            sudo docker compose down
            sudo docker compose up -d --build