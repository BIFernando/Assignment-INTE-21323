    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Dashboard — TMS</title>
      <link rel="stylesheet" href="../css/main.css">
      <link rel="stylesheet" href="../css/components.css">
    </head>
    <body>

      <div class="container">
        <div class="page-header">
          <h1 class="page-title">Dashboard</h1>
        </div>

        <!-- Summary Cards -->
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:30px;">
          <div class="card" style="text-align:center;">
            <div style="font-size:36px; font-weight:700; color:#7c8cff;"
                 id="countTodo">—</div>
            <div style="color:#888; margin-top:4px;">To Do</div>
          </div>
          <div class="card" style="text-align:center;">
            <div style="font-size:36px; font-weight:700; color:#63b3ed;"
                 id="countInProgress">—</div>
            <div style="color:#888; margin-top:4px;">In Progress</div>
          </div>
          <div class="card" style="text-align:center;">
            <div style="font-size:36px; font-weight:700; color:#68d391;"
                 id="countDone">—</div>
            <div style="color:#888; margin-top:4px;">Completed</div>
          </div>
        </div>

        <!-- Recent Tasks Table -->
        <div class="card">
          <h2 style="margin-bottom:16px; font-size:18px;">Recent Tasks</h2>
          <table class="data-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Due Date</th>
              </tr>
            </thead>
            <tbody id="recentTasksBody">
              <tr><td colspan="4">Loading...</td></tr>
            </tbody>
          </table>
        </div>

      </div>

      <script src="../js/api.js"></script>
      <script src="../js/auth.js"></script>
      <script>
        requireAuth();
        renderNavbar('dashboard');

        async function loadDashboard() {
          try {
            const tasks = await taskAPI.getAll();

            // Count by status
            const todo       = tasks.filter(t => t.status === 'TODO').length;
            const inProgress = tasks.filter(t => t.status === 'IN_PROGRESS').length;
            const done       = tasks.filter(t => t.status === 'COMPLETED').length;

            document.getElementById('countTodo').textContent       = todo;
            document.getElementById('countInProgress').textContent = inProgress;
            document.getElementById('countDone').textContent       = done;

            // Show 5 most recent tasks in table
            const recent = tasks.slice(0, 5);
            const tbody  = document.getElementById('recentTasksBody');

            if (recent.length === 0) {
              tbody.innerHTML = '<tr><td colspan="4">No tasks yet.</td></tr>';
              return;
            }

            tbody.innerHTML = recent.map(task => `
              <tr style="cursor:pointer;"
                  onclick="window.location.href='task-detail.html?id=${task.id}'">
                <td>${task.title}</td>
                <td>
                  <span class="badge badge-${task.priority.toLowerCase()}">
                    ${task.priority}
                  </span>
                </td>
                <td>
                  <span class="badge status-${task.status.toLowerCase()}">
                    ${task.status.replace('_', ' ')}
                  </span>
                </td>
                <td>${task.dueDate
                      ? new Date(task.dueDate).toLocaleDateString()
                      : 'No deadline'}</td>
              </tr>
            `).join('');

          } catch (err) {
            console.error('Dashboard load error:', err);
          }
        }

        loadDashboard();
      </script>

    </body>
    </html>
