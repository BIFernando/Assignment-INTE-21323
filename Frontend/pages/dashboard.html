<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — TaskFlow TMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <!-- Sidebar injected by auth.js -->

  <div class="app-layout">
    <div class="main-content">

      <!-- Topbar -->
      <div class="topbar">
        <div>
          <div class="topbar-title">Dashboard</div>
          <div class="topbar-subtitle">Overview of your tasks</div>
        </div>
        <div class="topbar-actions">
          <button class="notif-btn" id="notifBtn">
            <i class="bi bi-bell"></i>
            <span class="notif-badge" id="notifBadge"></span>
          </button>
        </div>
      </div>

      <!-- Stat Cards -->
      <div class="stat-grid">

        <div class="stat-card">
          <div class="stat-icon indigo">
            <i class="bi bi-list-check" style="color:var(--primary);"></i>
          </div>
          <div class="stat-info">
            <div class="stat-value" id="countTotal">0</div>
            <div class="stat-label">Total Tasks</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon amber">
            <i class="bi bi-hourglass-split" style="color:var(--warning);"></i>
          </div>
          <div class="stat-info">
            <div class="stat-value" id="countTodo">0</div>
            <div class="stat-label">To Do</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon blue">
            <i class="bi bi-arrow-repeat" style="color:#3B82F6;"></i>
          </div>
          <div class="stat-info">
            <div class="stat-value" id="countInProgress">0</div>
            <div class="stat-label">In Progress</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon emerald">
            <i class="bi bi-check-circle" style="color:var(--success);"></i>
          </div>
          <div class="stat-info">
            <div class="stat-value" id="countDone">0</div>
            <div class="stat-label">Completed</div>
          </div>
        </div>

      </div>

      <!-- Recent Tasks -->
      <div class="card">
        <div class="section-header">
          <div class="section-title">Recent Tasks</div>
          <a href="projects.html" class="btn btn-ghost btn-sm">
            View All <i class="bi bi-arrow-right"></i>
          </a>
        </div>

        <div class="table-wrapper" style="border:none; box-shadow:none;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Task</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Due Date</th>
              </tr>
            </thead>
            <tbody id="recentTasksBody">
              <tr>
                <td colspan="4">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts — order matters, load once each -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/socket.js"></script>
  <script src="../js/dashboard.js"></script>

</body>
</html>
