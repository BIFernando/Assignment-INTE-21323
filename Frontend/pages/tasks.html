    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Tasks — TMS</title>

      <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

      <link rel="stylesheet" href="../css/main.css">
      <link rel="stylesheet" href="../css/components.css">
      <!-- SortableJS for drag and drop — loaded from CDN -->
      <script src="../js/vendor/Sortable.min.js"></script>
    </head>
    <body>

      <!-- Create Task Modal -->
      <div class="modal-overlay" id="createModal">
        <div class="modal">
          <div class="modal-header">
            <span class="modal-title">Create New Task</span>
            <span class="modal-close" id="closeModal">&times;</span>
          </div>
          <div class="alert error" id="modalError"></div>
          <div class="form-group">
            <label>Title *</label>
            <input type="text" id="taskTitle" placeholder="Task title">
            <span class="error-message" id="titleError">Title is required.</span>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="taskDesc" rows="3" placeholder="Optional description"></textarea>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select id="taskPriority">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
            </select>
          </div>
          <div class="form-group">
            <label>Due Date</label>
            <input type="date" id="taskDueDate">
          </div>
          <button class="btn btn-primary" id="saveTaskBtn"
                  style="width:100%;">Create Task</button>
        </div>
      </div>

      <div class="container">
        <div class="page-header">
          <h1 class="page-title">Tasks</h1>
          <div style="display:flex; gap:10px; align-items:center;">
            <!-- Filter -->
            <select id="filterStatus" class="btn btn-secondary">
              <option value="">All Statuses</option>
              <option value="TODO">To Do</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="COMPLETED">Completed</option>
            </select>
            <select id="filterPriority" class="btn btn-secondary">
              <option value="">All Priorities</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
            </select>
            <!-- View Toggle -->
            <button class="btn btn-secondary" id="toggleView">
              Switch to Kanban
            </button>
            <!-- Create button — hidden for Collaborators -->
            <button class="btn btn-primary" id="createTaskBtn">
              + New Task
            </button>
          </div>
        </div>

        <div class="alert error" id="pageError"></div>

        <!-- LIST VIEW -->
        <div id="listView">
          <table class="data-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Due Date</th>
                <th>Assigned To</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="taskTableBody">
              <tr><td colspan="6">Loading tasks...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- KANBAN VIEW (hidden by default) -->
        <div id="kanbanView" style="display:none;">
          <div class="kanban-board">
            <div class="kanban-column col-todo" id="col-TODO">
              <div class="kanban-column-header">
                To Do <span id="count-TODO">0</span>
              </div>
              <div class="kanban-cards" id="cards-TODO"></div>
            </div>
            <div class="kanban-column col-inprogress" id="col-IN_PROGRESS">
              <div class="kanban-column-header">
                In Progress <span id="count-IN_PROGRESS">0</span>
              </div>
              <div class="kanban-cards" id="cards-IN_PROGRESS"></div>
            </div>
            <div class="kanban-column col-completed" id="col-COMPLETED">
              <div class="kanban-column-header">
                Completed <span id="count-COMPLETED">0</span>
              </div>
              <div class="kanban-cards" id="cards-COMPLETED"></div>
            </div>
          </div>
        </div>

      </div>

      <script src="../js/api.js"></script>
      <script src="../js/auth.js"></script>
      <script src="../js/socket.js"></script>
      <script src="../js/tasks.js"></script>

    </body>
    </html>
