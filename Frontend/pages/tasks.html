<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — TaskFlow TMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>

  <!-- Create Task Modal -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Create New Task</span>
        <span class="modal-close" id="closeModal">&times;</span>
      </div>

      <div class="alert error" id="modalError"></div>

      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="taskTitle" placeholder="Task title">
        <span class="error-message" id="titleError">Title is required.</span>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="taskDesc" rows="3" placeholder="Optional description"></textarea>
      </div>

      <div class="form-group">
        <label>Priority</label>
        <select id="taskPriority">
          <option value="LOW">Low</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="HIGH">High</option>
        </select>
      </div>

      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="taskDueDate">
      </div>

      <div class="form-group">
        <label>Assign To (optional)</label>
        <select id="taskAssignees" class="form-control" multiple style="min-height:100px;">
          <!-- populated dynamically -->
        </select>
        <span style="font-size:12px; color:var(--text-muted);">
          Hold Ctrl (Windows) or Cmd (Mac) to select multiple people.
        </span>
      </div>

      <button class="btn btn-primary" id="saveTaskBtn" style="width:100%;">
        Create Task
      </button>
    </div>
  </div>

  <!-- App Layout -->
  <div class="app-layout">
    <div class="main-content">

      <!-- Topbar -->
      <div class="topbar">
        <button class="hamburger-btn" id="hamburgerBtn" style="display:none; align-items:center; justify-content:center;
           background:none; border:none; cursor:pointer;
           padding:8px; color:var(--text);" onclick="document.querySelector('.sidebar').classList.toggle('open')">
          <i class="bi bi-list" style="font-size:24px;"></i>
        </button>
        <div>
          <div class="topbar-title">Tasks</div>
          <div class="topbar-subtitle">Manage and track project tasks</div>
        </div>

        <div class="topbar-actions">
          <button class="notif-btn" id="notifBtn">
            <i class="bi bi-bell"></i>
            <span class="notif-badge" id="notifBadge"></span>
          </button>

          <button class="btn btn-secondary" id="toggleView">
            Switch to Kanban
          </button>

          <button class="btn btn-primary" id="createTaskBtn">
            + New Task
          </button>
        </div>
      </div>

      <div class="alert error" id="pageError"></div>

      <!-- LIST VIEW -->
      <div id="listView">
        <div class="table-responsive"></div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Due Date</th>
              <th>Assigned To</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="taskTableBody">
            <tr>
              <td colspan="6">Loading tasks...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- KANBAN VIEW -->
      <div id="kanbanView" style="display:none;">
        <div class="kanban-board">

          <div class="kanban-column col-todo">
            <div class="kanban-header">
              <div class="kanban-header-left">
                <div class="kanban-dot"></div>
                <span class="kanban-col-title">To Do</span>
              </div>
              <span class="kanban-count" id="count-TODO">0</span>
            </div>
            <div class="kanban-cards" id="cards-TODO"></div>
          </div>

          <div class="kanban-column col-progress">
            <div class="kanban-header">
              <div class="kanban-header-left">
                <div class="kanban-dot"></div>
                <span class="kanban-col-title">In Progress</span>
              </div>
              <span class="kanban-count" id="count-IN_PROGRESS">0</span>
            </div>
            <div class="kanban-cards" id="cards-IN_PROGRESS"></div>
          </div>

          <div class="kanban-column col-done">
            <div class="kanban-header">
              <div class="kanban-header-left">
                <div class="kanban-dot"></div>
                <span class="kanban-col-title">Completed</span>
              </div>
              <span class="kanban-count" id="count-COMPLETED">0</span>
            </div>
            <div class="kanban-cards" id="cards-COMPLETED"></div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/socket.js"></script>
  <script src="../js/tasks.js"></script>
</body>

</html>
