<!DOCTYPE html>



<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — TaskFlow TMS</title>



  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
</head>

<body>

  <!-- Create User Modal -->

  <div class="modal-overlay" id="createUserModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Create New User</span>
        <span class="modal-close" id="closeUserModal">&times;</span>
      </div>


      <div class="alert error" id="userModalError"></div>

      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="userName" placeholder="John Smith">
      </div>

      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="userEmail" placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label>Role *</label>
        <select id="userRole">
          <option value="collaborator">Collaborator</option>
          <option value="project_manager">Project Manager</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <button class="btn btn-primary" id="saveUserBtn" style="width:100%;">
        Create User & Send Email
      </button>
    </div>


  </div>

  <div class="app-layout">
    <div class="main-content">

      <!-- Topbar -->
      <div class="topbar">
        <button class="hamburger-btn" id="hamburgerBtn" style="display:none; align-items:center; justify-content:center;
           background:none; border:none; cursor:pointer;
           padding:8px; color:var(--text);" onclick="document.querySelector('.sidebar').classList.toggle('open')">
          <i class="bi bi-list" style="font-size:24px;"></i>
        </button>
        <div>
          <div class="topbar-title">User Management</div>
          <div class="topbar-subtitle">
            Manage users and permissions
          </div>
        </div>

        <div class="topbar-actions">
          <button class="notif-btn" id="notifBtn">
            <i class="bi bi-bell"></i>
            <span class="notif-badge" id="notifBadge"></span>
          </button>

          <button class="btn btn-primary" id="createUserBtn">
            + New User
          </button>
        </div>
      </div>

      <div class="alert success" id="successAlert"></div>
      <div class="alert error" id="errorAlert"></div>
      <div class="table-responsive"></div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="usersTableBody">
          <tr>
            <td colspan="5">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>


  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script> <!-- MUST be first -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/socket.js"></script>
  <script src="../js/users.js"></script>

</body>

</html>
