<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — TaskFlow TMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
</head>

<body>

  <!-- Create Project Modal -->
  <div class="modal-overlay" id="createProjectModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">New Project</span>
        <span class="modal-close" id="closeProjectModal">&times;</span>
      </div>
      <div class="alert error" id="projectModalError"></div>
      <div class="form-group">
        <label>Project Name *</label>
        <input type="text" id="projectName" class="form-control" placeholder="My Awesome Project">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="projectDesc" class="form-control" rows="3" placeholder="What is this project about?"></textarea>
      </div>
      <button class="btn btn-primary" id="saveProjectBtn" style="width:100%;">
        Create Project
      </button>
    </div>
  </div>

  <div class="app-layout">
    <div class="main-content">

      <div class="topbar">
        <button class="hamburger-btn" id="hamburgerBtn" style="display:none; align-items:center; justify-content:center;
           background:none; border:none; cursor:pointer;
           padding:8px; color:var(--text);" onclick="document.querySelector('.sidebar').classList.toggle('open')">
          <i class="bi bi-list" style="font-size:24px;"></i>
        </button>
        <div>
          <div class="topbar-title">Projects</div>
          <div class="topbar-subtitle">Your projects and workspaces</div>
        </div>
        <div class="topbar-actions">
          <button class="notif-btn" id="notifBtn">
            <i class="bi bi-bell"></i>
            <span class="notif-badge" id="notifBadge"></span>
          </button>
          <button class="btn btn-primary" id="createProjectBtn">+ New Project</button>
        </div>
      </div>

      <div class="alert error" id="pageError"></div>

      <div id="projectsGrid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px;">
        <p style="color:var(--text-muted);">Loading projects...</p>
      </div>

    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/socket.js"></script>
  <script src="../js/projects.js"></script>
</body>

</html>
