<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — TaskFlow TMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>

<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="sidebar-logo-icon">
          <i class="bi bi-kanban"></i>
        </div>
        <div class="auth-logo-text">TaskFlow</div>
      </div>

      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your new password below.</p>

      <div class="alert error" id="errorAlert"></div>
      <div class="alert success" id="successAlert"></div>

      <div class="form-group">
        <label>New Password *</label>
        <input type="password" id="newPassword" class="form-control" placeholder="Min 8 chars, 1 uppercase, 1 number"
          autocomplete="new-password">
      </div>

      <div class="form-group">
        <label>Confirm Password *</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat your new password"
          autocomplete="new-password">
      </div>

      <button class="btn btn-primary" id="resetBtn" style="width:100%;">
        Reset Password
      </button>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/reset-password.js"></script>
</body>

</html>
