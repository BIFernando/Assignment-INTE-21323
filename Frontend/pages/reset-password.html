<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Set New Password — TMS</title>
      <link rel="stylesheet" href="../css/main.css">
    </head>
    <body>

      <div class="login-container">
        <div class="login-box">

          <div class="login-title">Set Your Password</div>
          <div class="login-subtitle">
            You must set a new password before continuing.
          </div>

          <div class="alert error"   id="errorAlert"></div>
          <div class="alert success" id="successAlert"></div>

          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword"
                   placeholder="At least 8 characters">
            <span class="error-message" id="passError">
              Password must be at least 8 characters.
            </span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Repeat your new password">
            <span class="error-message" id="confirmError">
              Passwords do not match.
            </span>
          </div>

          <button class="btn btn-primary" id="resetBtn"
                  style="width:100%; margin-top:8px;">
            Set Password & Continue
          </button>

        </div>
      </div>

      <script src="../js/api.js"></script>
      <script>
        // Guard — must be logged in to see this page
        if (!localStorage.getItem('token')) {
          window.location.href = 'login.html';
        }

        document.getElementById('resetBtn')
          .addEventListener('click', async () => {

          const newPassword     = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmPassword').value;

          // Hide previous messages
          document.getElementById('errorAlert').classList.remove('show');
          document.getElementById('successAlert').classList.remove('show');
          document.getElementById('passError').classList.remove('show');
          document.getElementById('confirmError').classList.remove('show');

          // Validate
          let valid = true;
          if (!newPassword || newPassword.length < 8) {
            document.getElementById('passError').classList.add('show');
            valid = false;
          }
          if (newPassword !== confirmPassword) {
            document.getElementById('confirmError').classList.add('show');
            valid = false;
          }
          if (!valid) return;

          const btn = document.getElementById('resetBtn');
          btn.disabled = true;
          btn.textContent = 'Saving...';

          try {
            await authAPI.resetPassword(newPassword);

            const successAlert = document.getElementById('successAlert');
            successAlert.textContent = 'Password set! Redirecting...';
            successAlert.classList.add('show');

            // Redirect to dashboard after 1.5 seconds
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1500);

          } catch (err) {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.textContent = err.message;
            errorAlert.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'Set Password & Continue';
          }
        });
      </script>

    </body>
    </html>
