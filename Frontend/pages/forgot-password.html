<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — TaskFlow TMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>

<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="sidebar-logo-icon">
          <i class="bi bi-kanban"></i>
        </div>
        <div class="auth-logo-text">TaskFlow</div>
      </div>

      <h1 class="auth-title">Forgot Password</h1>
      <p class="auth-subtitle">
        Enter your email and we will send you a reset link.
      </p>

      <div class="alert error" id="errorAlert"></div>
      <div class="alert success" id="successAlert"></div>

      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="email" class="form-control" placeholder="your@email.com" autocomplete="off">
      </div>

      <button class="btn btn-primary" id="submitBtn" style="width:100%;">
        Send Reset Link
      </button>

      <p style="text-align:center; margin-top:16px;
                  font-size:14px; color:var(--text-muted);">
        Remember your password?
        <a href="login.html" style="color:var(--primary); font-weight:600;">
          Sign in
        </a>
      </p>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/forgot-password.js"></script>
</body>

</html>
